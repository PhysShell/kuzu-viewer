name: Build Windows VSIX

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kuzu-explorer

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: kuzu-explorer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Compile and test
        run: npm test

      - name: Package Windows VSIX
        run: npx @vscode/vsce package --target win32-x64 -o kuzu-explorer-win32-x64.vsix

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: kuzu-explorer-win32-x64
          path: kuzu-explorer/kuzu-explorer-win32-x64.vsix

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME .\kuzu-explorer-win32-x64.vsix --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME .\kuzu-explorer-win32-x64.vsix --generate-notes --title $env:GITHUB_REF_NAME
          }
